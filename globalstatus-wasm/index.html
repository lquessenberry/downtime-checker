<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>QuietEarth</title>
  <style>
    html, body { margin: 0; height: 100%; background: #070b10; overflow: hidden; color: #d7dde8; font: 13px/1.4 ui-sans-serif, system-ui, sans-serif; }
    canvas { width: 100%; height: 100%; display: block; outline: none; }
    #boot {
      position: absolute; left: 16px; top: 16px; z-index: 2;
      color: #8b95a7; max-width: 28rem; white-space: pre-wrap;
    }
    #hudlink {
      position: absolute; right: 12px; bottom: 10px; z-index: 2;
      color: #6ee7b7; text-decoration: none; font-size: 11px; letter-spacing: .08em;
    }
  </style>
</head>
<body>
  <div id="boot">QuietEarth starting…</div>
  <canvas id="globe" tabindex="0"></canvas>
  <a id="hudlink" href="/hud.html">HUD alpha</a>
  <script type="module">
    import init, { WebHandle } from "./downtime_globe_native.js";
    const boot = document.getElementById("boot");
    const canvas = document.getElementById("globe");
    try {
      await init();
      const handle = new WebHandle();
      await handle.start(canvas);
      boot.remove();
    } catch (err) {
      boot.textContent = "QuietEarth failed: " + (err && err.message ? err.message : err);
      console.error(err);
    }
  </script>
</body>
</html>
