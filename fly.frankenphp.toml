# FrankenPHP stage for the globalstatus/ Cesium site.
# The app name is a placeholder. Deploy with an explicit -a:
#   flyctl deploy -c fly.frankenphp.toml -a <app>
# No volume: caches live on the machine and refill from the sources.
app = 'globalstatus-franken'
primary_region = 'dfw'

[build]
  dockerfile = 'deploy/frankenphp/Dockerfile'

[env]
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [http_service.concurrency]
    type = 'requests'
    soft_limit = 200
    hard_limit = 400

  [[http_service.checks]]
    grace_period = '15s'
    interval = '30s'
    timeout = '5s'
    method = 'GET'
    path = '/healthz'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
