# FrankenPHP stage for the globalstatus/ Cesium site with Will's live poller.
# Always pass -a globalstatus-stage. Staging only.
#   flyctl deploy -c fly.frankenphp.toml -a globalstatus-stage --ha=false
app = 'globalstatus-stage'
primary_region = 'dfw'

[build]
  dockerfile = 'deploy/frankenphp/Dockerfile'

[env]
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [http_service.concurrency]
    type = 'requests'
    soft_limit = 200
    hard_limit = 400

  [[http_service.checks]]
    grace_period = '15s'
    interval = '30s'
    timeout = '5s'
    method = 'GET'
    path = '/healthz'

[mounts]
  source = 'gsa_data'
  destination = '/app/public/data'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
