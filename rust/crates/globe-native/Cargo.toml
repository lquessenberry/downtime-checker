[package]
name = "downtime-globe-native"
edition.workspace = true
version.workspace = true
publish.workspace = true
rust-version.workspace = true
description = "Native Downtime globe: wgpu sphere + egui chrome, linked to downtime-core"

[[bin]]
name = "downtime-globe"
path = "src/main.rs"

[dependencies]
downtime-core = { path = "../downtime-core" }
downtime-native = { path = "../downtime-native" }
eframe = { version = "0.32", default-features = false, features = ["wgpu", "default_fonts", "x11", "wayland"] }
# Same wgpu as eframe 0.32; listed directly so its default GPU backends
# (Vulkan, Metal, DX12, GLES, WGSL) are compiled in.
wgpu = "25"
bytemuck = { version = "1", features = ["derive"] }
glam = "0.30"
