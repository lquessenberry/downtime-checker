[package]
name = "downtime-cli"
edition.workspace = true
version.workspace = true
publish.workspace = true
description = "Native downtime checker CLI"

[[bin]]
name = "downtime"
path = "src/main.rs"

[dependencies]
downtime-core = { path = "../downtime-core" }
downtime-native = { path = "../downtime-native" }
tokio = { version = "1.42", features = ["rt-multi-thread", "macros", "time", "sync"] }
serde_json = "1.0"
