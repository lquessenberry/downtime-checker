server {
    listen 8080 default_server;
    listen [::]:8080 default_server;
    root /app;
    index index.html;
    server_name _;
    client_max_body_size 8m;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json application/wasm image/svg+xml;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /data/ {
        deny all;
    }

    location ~* ^/(index\.html|cesium\.(js|css)|sw\.js|manifest\.webmanifest)$ {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    location ~ ^/api/(feeds|scan|scan-state|poll-status|events|stop|outages|mil|mesh|disease|animal)$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /app/router.php;
        fastcgi_param SCRIPT_NAME /router.php;
        fastcgi_param PATH_INFO $uri;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_read_timeout 60s;
        fastcgi_buffering off;
    }

    location /api/ {
        try_files $uri.json $uri @php_api;
    }

    location @php_api {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /app/router.php;
        fastcgi_param SCRIPT_NAME /router.php;
        fastcgi_param PATH_INFO $uri;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_read_timeout 60s;
        fastcgi_buffering off;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    error_log /dev/stderr warn;
}
