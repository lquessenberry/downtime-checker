# PHP Global Status App staging (Will's globe, not the Node downtime-globe).
# Deploy: fly deploy -c fly.gsa.toml --ha=false
# Preview: https://globalstatus-stage.fly.dev/

app = 'globalstatus-stage'
primary_region = 'dfw'

[build]
  dockerfile = 'Dockerfile.gsa'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [[http_service.checks]]
    grace_period = '25s'
    interval = '30s'
    timeout = '8s'
    method = 'GET'
    path = '/'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
