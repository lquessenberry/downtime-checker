name: Copilot review loop

# 1. On every new or updated PR into the default branch, ask Copilot to review.
# 2. "Copilot review gate" is a status check that only passes once Copilot has
#    submitted a review on this PR. Make it a required check (docs/AUTOMATION.md)
#    so nothing merges without a completed Copilot review.
# Uses only the built-in GITHUB_TOKEN. No secrets, no merges, no deploys.
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  pull_request_review:
    types: [submitted, dismissed]
  workflow_dispatch:
    inputs:
      pr:
        description: PR number to (re)request Copilot on
        required: true

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: copilot-review-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: false

jobs:
  request:
    name: Request Copilot review
    if: >-
      (github.event_name == 'pull_request' && !github.event.pull_request.draft &&
       github.event.pull_request.head.repo.full_name == github.repository) ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.pull_request.number || inputs.pr }}
    steps:
      - name: Ask Copilot
        # The repository ruleset "Automatically request Copilot code review" is the
        # reliable path; this step is a best-effort backup and never fails the PR.
        continue-on-error: true
        run: |
          set -u
          if gh pr edit "$PR" -R "$GITHUB_REPOSITORY" --add-reviewer "@copilot"; then
            echo "Copilot review requested on #$PR"
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/pulls/$PR/requested_reviewers" \
              -f 'reviewers[]=copilot-pull-request-reviewer[bot]' \
              && echo "Copilot review requested via REST" \
              || echo "::warning::Could not request Copilot from Actions; enable the ruleset in docs/AUTOMATION.md"
          fi

  gate:
    name: Copilot review gate
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.pull_request.number }}
    steps:
      - name: Require a submitted Copilot review
        run: |
          set -euo pipefail
          reviews=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/reviews" --paginate \
            --jq '[.[] | select(.user.login == "copilot-pull-request-reviewer[bot]" or .user.login == "Copilot" or (.is_copilot_code_review // false)) | select(.state != "DISMISSED")] | length')
          head=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" --jq .head.sha)
          on_head=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/reviews" --paginate \
            --jq "[.[] | select(.user.login == \"copilot-pull-request-reviewer[bot]\" or .user.login == \"Copilot\" or (.is_copilot_code_review // false)) | select(.commit_id == \"$head\")] | length")
          echo "Copilot reviews on PR: $reviews (on current head $head: $on_head)"
          if [ "$reviews" -eq 0 ]; then
            echo "::error::No completed Copilot review yet. Wait for it (or re-run 'Copilot review loop' with workflow_dispatch) before merging."
            exit 1
          fi
          if [ "$on_head" -eq 0 ]; then
            echo "::warning::Copilot reviewed an earlier commit. Re-request if the new commits are more than review fixes."
          fi
