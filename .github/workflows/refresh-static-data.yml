name: Refresh static data

# Cron only runs from the repository default branch.
# github.event.schedule is the cron expression that fired.
on:
  schedule:
    - cron: "17 5,17 * * *"
    - cron: "47 8 * * *"
    - cron: "12 9 * * 1"
  workflow_dispatch:
    inputs:
      datasets:
        description: Which static packs to refresh
        type: choice
        options:
          - overlays
          - streams
          - radio
          - catalog
          - all
        default: overlays
      commit:
        description: Commit changed JSON back to this branch
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: refresh-static-data
  cancel-in-progress: false

jobs:
  refresh:
    name: Snapshot static overlays
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Choose datasets
        id: pick
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ds="${{ inputs.datasets }}"
          else
            case "${{ github.event.schedule }}" in
              "17 5,17 * * *") ds=overlays ;;
              "47 8 * * *") ds=streams ;;
              "12 9 * * 1") ds=radio ;;
              *) ds=overlays ;;
            esac
          fi
          echo "datasets=$ds" >> "$GITHUB_OUTPUT"
          echo "Refreshing $ds"

      - name: Fetch packs
        env:
          DATASETS: ${{ steps.pick.outputs.datasets }}
          HPDB_CACHE: ${{ runner.temp }}/hpdb
          # Uniden BT885 Update Manager login (repo secrets). Without them the radio pack keeps its last copy.
          BT885_FTP_USER: ${{ secrets.BT885_FTP_USER }}
          BT885_FTP_PASS: ${{ secrets.BT885_FTP_PASS }}
        run: node scripts/refresh_static_data.mjs

      - name: Commit if changed
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.commit }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            visualizer/data/pack.json \
            visualizer/data/catalog.json \
            visualizer/data/websdr.json \
            visualizer/data/gpsjam.json \
            visualizer/data/conflicts.json \
            visualizer/data/streams.json \
            visualizer/data/radio.json \
            globalstatus/api/catalog.json \
            globalstatus/api/websdr.json \
            globalstatus/api/gpsjam.json \
            globalstatus/api/conflicts.json \
            globalstatus/api/streams.json \
            globalstatus/api/radio.json \
            || true
          if git diff --cached --quiet; then
            echo "No data changes"
            exit 0
          fi
          git commit -m "Refresh static data (${{ steps.pick.outputs.datasets }})."
          git push
