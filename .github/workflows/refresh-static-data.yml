name: Refresh static data

# Cron only runs from the repository default branch.
# github.event.schedule is the cron expression that fired.
# The default branch is protected (GH013), so this workflow commits to
# bot/refresh-static-<datasets> and opens or updates a pull request into
# the branch it ran on, instead of pushing directly.
on:
  schedule:
    - cron: "17 5,17 * * *"
    - cron: "47 8 * * *"
    - cron: "12 9 * * 1"
  workflow_dispatch:
    inputs:
      datasets:
        description: Which static packs to refresh
        type: choice
        options:
          - overlays
          - streams
          - radio
          - catalog
          - all
        default: overlays
      commit:
        description: Open or update a PR if JSON packs changed
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: refresh-static-data
  cancel-in-progress: false

jobs:
  refresh:
    name: Snapshot static overlays
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Choose datasets
        id: pick
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ds="${{ inputs.datasets }}"
          else
            case "${{ github.event.schedule }}" in
              "17 5,17 * * *") ds=overlays ;;
              "47 8 * * *") ds=streams ;;
              "12 9 * * 1") ds=radio ;;
              *) ds=overlays ;;
            esac
          fi
          echo "datasets=$ds" >> "$GITHUB_OUTPUT"
          echo "Refreshing $ds"

      - name: Fetch packs
        env:
          DATASETS: ${{ steps.pick.outputs.datasets }}
          HPDB_CACHE: ${{ runner.temp }}/hpdb
        run: node scripts/refresh_static_data.mjs

      - name: Guard shrunken or invalid packs
        run: node scripts/static_data_guard.mjs

      - name: Open or update PR if changed
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.commit }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            visualizer/data/pack.json \
            visualizer/data/catalog.json \
            visualizer/data/websdr.json \
            visualizer/data/gpsjam.json \
            visualizer/data/conflicts.json \
            visualizer/data/streams.json \
            visualizer/data/radio.json \
            globalstatus/api/catalog.json \
            globalstatus/api/websdr.json \
            globalstatus/api/gpsjam.json \
            globalstatus/api/conflicts.json \
            globalstatus/api/streams.json \
            globalstatus/api/radio.json \
            || true
          if git diff --cached --quiet; then
            echo "No data changes"
            exit 0
          fi
          ds="${{ steps.pick.outputs.datasets }}"
          base="${{ github.ref_name }}"
          bot="bot/refresh-static-${ds}"
          title="Refresh static data (${ds})"
          body="$(cat <<MD
          Automated refresh of static JSON packs (\`${ds}\`).

          The default branch is protected (GH013: changes must be made through a pull request), so this workflow commits to \`${bot}\` and opens or updates this PR into \`${base}\`.

          ## Review

          - A shrink guard skipped any pack that was invalid JSON, empty, or lost more than 50% of its records versus the current file on \`${base}\` (byte size is used only when there is no record count). See the workflow log for skipped files.
          - This PR may include \`globalstatus/api/*.json\`. Merging it into \`feat/globalstatus-prod\` **will** trigger the production FTP deploy. Please review the data diff before merging.
          - Pull requests created with \`GITHUB_TOKEN\` do not trigger other workflows (including PR CI). Close and reopen this PR, or switch the refresh workflow to a PAT or GitHub App token, if you want CI to run on it.
          - Later refreshes of the \`${ds}\` pack update this same PR (the latest snapshot wins).
          MD
          )"
          git checkout -B "$bot"
          git commit -m "Refresh static data (${ds})."
          git fetch origin "refs/heads/${bot}:refs/remotes/origin/${bot}" || true
          if git rev-parse --verify --quiet "origin/${bot}"; then
            git push --force-with-lease="refs/heads/${bot}:refs/remotes/origin/${bot}" origin "HEAD:refs/heads/${bot}"
          else
            git push origin "HEAD:refs/heads/${bot}"
          fi
          pr="$(gh pr list --repo "${GITHUB_REPOSITORY}" --head "${bot}" --base "${base}" --state open --json number --jq '.[0].number // empty')"
          if [ -n "${pr}" ]; then
            gh pr edit "${pr}" --title "${title}" --body "${body}"
            echo "Updated PR #${pr}"
          else
            gh pr create --base "${base}" --head "${bot}" --title "${title}" --body "${body}"
          fi
