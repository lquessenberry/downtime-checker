name: Refresh static data

# Cron only runs from the repository default branch.
# github.event.schedule is the cron expression that fired.
# The default branch is protected (GH013), so this workflow opens a PR
# instead of pushing commits directly.
on:
  schedule:
    - cron: "17 5,17 * * *"
    - cron: "47 8 * * *"
    - cron: "12 9 * * 1"
  workflow_dispatch:
    inputs:
      datasets:
        description: Which static packs to refresh
        type: choice
        options:
          - overlays
          - streams
          - radio
          - catalog
          - all
        default: overlays
      commit:
        description: Open a PR if JSON packs changed
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: refresh-static-data
  cancel-in-progress: false

jobs:
  refresh:
    name: Snapshot static overlays
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Choose datasets
        id: pick
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ds="${{ inputs.datasets }}"
          else
            case "${{ github.event.schedule }}" in
              "17 5,17 * * *") ds=overlays ;;
              "47 8 * * *") ds=streams ;;
              "12 9 * * 1") ds=radio ;;
              *) ds=overlays ;;
            esac
          fi
          echo "datasets=$ds" >> "$GITHUB_OUTPUT"
          echo "Refreshing $ds"

      - name: Fetch packs
        env:
          DATASETS: ${{ steps.pick.outputs.datasets }}
          HPDB_CACHE: ${{ runner.temp }}/hpdb
        run: node scripts/refresh_static_data.mjs

      - name: Open PR if changed
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.commit }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            visualizer/data/pack.json \
            visualizer/data/catalog.json \
            visualizer/data/websdr.json \
            visualizer/data/gpsjam.json \
            visualizer/data/conflicts.json \
            visualizer/data/streams.json \
            visualizer/data/radio.json \
            globalstatus/api/catalog.json \
            globalstatus/api/websdr.json \
            globalstatus/api/gpsjam.json \
            globalstatus/api/conflicts.json \
            globalstatus/api/streams.json \
            globalstatus/api/radio.json \
            || true
          if git diff --cached --quiet; then
            echo "No data changes"
            exit 0
          fi
          base="${{ github.event.repository.default_branch }}"
          ds="${{ steps.pick.outputs.datasets }}"
          branch="bot/refresh-static-${ds}-$(date -u +%Y%m%dT%H%M%SZ)"
          git checkout -b "$branch"
          git commit -m "Refresh static data (${ds})."
          git push origin "$branch"
          gh pr create \
            --base "$base" \
            --head "$branch" \
            --title "Refresh static data (${ds})" \
            --body "Automated refresh of static JSON packs (${ds}). Opens a PR because the default branch is protected (GH013). Please review before merge. No deploy."
