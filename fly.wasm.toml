# WASM (no Cesium) alpha on the GSA staging app.
# Deploy: fly deploy -c fly.wasm.toml --ha=false -a globalstatus-stage
app = 'globalstatus-stage'
primary_region = 'dfw'

[build]
  dockerfile = 'Dockerfile.wasm'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    grace_period = '40s'
    interval = '30s'
    timeout = '10s'
    method = 'GET'
    path = '/healthz'

[[vm]]
  memory = '1024mb'
  cpu_kind = 'shared'
  cpus = 1
